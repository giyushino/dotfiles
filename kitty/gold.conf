include ./gold_colors.conf
#include ./test2.conf
#include ./black.conf

# comment out for different font
font_family JetBrains Mono
# Gold Rush uses 14; bump if you prefer the 18 of the other themes
font_size 18

# Gold Rush padding (12px); other themes use 5 10
window_padding_width 12
blur {
    enabled = true
    size = 10
    passes = 3
}

inactive_border_color #B69121
active_border_color   #C9A227

background_opacity 1.0

enabled_layouts splits,stack
cursor_shape block
map ctrl+shift+enter launch --cwd=current
map ctrl+shift+, previous_tab
map ctrl+shift+. next_tab
map ctrl+shift+x toggle_layout stack


# Scrollback
scrollback_lines 10000
# scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
scrollback_pager nvim -c 'setlocal buftype=nofile bufhidden=hide noswapfile nonumber norelativenumber nolist showtabline=0 foldcolumn=0|Man!' -c "autocmd VimEnter * normal G" -
scrollback_pager_history_size 0
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 3.0

cursor_trail 3
