include ./kitty-themes/Red_Alert.conf
#include ./kitty-themes/themes/Red_Sands.conf

# comment out for different font
font_family JetBrains Mono
font_size 18

window_padding_width 5 10
blur {
    enabled = true
    size = 10
    passes = 3
}

inactive_border_color #3a2a2a
active_border_color   #cc6666

background_opacity 0.6

enabled_layouts splits,stack
cursor_shape block
map ctrl+shift+enter launch --cwd=current
map ctrl+shift+, previous_tab
map ctrl+shift+. next_tab
map ctrl+shift+x toggle_layout stack


# Scrollback
scrollback_lines 10000
# scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
scrollback_pager nvim -c 'setlocal buftype=nofile bufhidden=hide noswapfile nonumber norelativenumber nolist showtabline=0 foldcolumn=0|Man!' -c "autocmd VimEnter * normal G" -
scrollback_pager_history_size 0
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 3.0


cursor #cc6666
