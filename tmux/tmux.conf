# ── Basic Settings ─────────────────────────────────────────────

# Use Ctrl+a instead of Ctrl+b (optional but common)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Enable mouse support (click to select panes/windows, scroll works)
set -g mouse on

# Use UTF-8 & 256 colors
set -g default-terminal "screen-256color"

# Allow faster key repetition
set -s escape-time 0
set-option focus-events on

# Set history limit (scrollback)
set -g history-limit 10000

# ── Window & Pane Navigation ───────────────────────────────────

# Easier pane switching with Alt+arrow keys
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Split panes
#bind ? split-window -h
#bind - split-window -v

unbind '"'
unbind %

# ── Status Bar ─────────────────────────────────────────────────

# Refresh interval
set -g status-interval 5
set -g base-index 1

# Basic status bar styling
set -g status-bg black
set -g status-fg white
set -g status-justify centre

# Show session name, window list, date/time
set -g status-left "#[bold] #S "
set -g status-right "%Y-%m-%d %H:%M "


bind [ previous-window
bind ] next-window

# ── Quality of Life ────────────────────────────────────────────

# Vi-style copy mode (e.g., press Prefix+[ then use hjkl)
setw -g mode-keys vi
# Initialize TPM
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Auto-save sessions every 15 minutes
set -g @continuum-save-interval '15'
# Automatically restore when tmux starts
set -g @continuum-restore 'on'

# TPM initialization (keep at the bottom)
run '~/.tmux/plugins/tpm/tpm'
